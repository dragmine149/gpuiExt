[package]
name = "gpui_ext"
description = "Some useful functions i use when working with GPUI"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = {
  git = "https://github.com/longbridge/gpui-component.git",
}
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }

anyhow = "1.0.104"
async-channel = "2.5.0"
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
