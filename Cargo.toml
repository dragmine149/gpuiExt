[package]
name = "gpui_template"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = {
  git = "https://github.com/longbridge/gpui-component.git",
}
gpui-component-assets = {
  git = "https://github.com/longbridge/gpui-component.git"
}
gpui_platform = {
  git = "https://github.com/zed-industries/zed",
  features = ["font-kit", "runtime_shaders", "wayland", "x11"]
}

anyhow = "1.0.104"
async-channel = "2.5.0"
dirs = "6.0.0"
rand = "0.10.2"
rust-embed = "8.12.0"
serde = "1.0.229"
serde_json = "1.0.151"
strum = "0.28.0"
tokio = "1.53.1"
